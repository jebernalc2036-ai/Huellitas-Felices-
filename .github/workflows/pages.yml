name: Publicar panel admin

on:
  push:
    branches:
      - "claude/**"
      - "main"
    paths:
      - "admin/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta admin/
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
