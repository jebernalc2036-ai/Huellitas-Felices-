name: Android Build

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: parqueadero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Parqueadero · APK instalable"
          body: |
            APK generado automáticamente por GitHub Actions a partir del commit ${{ github.sha }}.

            Instalación: descarga `app-debug.apk`, ábrelo en el celular y permite instalar
            apps de "orígenes desconocidos" cuando el sistema lo pida.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
