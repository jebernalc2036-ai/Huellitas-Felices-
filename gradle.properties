org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Credenciales de Supabase para validar la licencia (ver supabase/schema.sql).
# La "anon key" está diseñada para ir dentro de apps públicas: la protección
# real la da Row Level Security en el servidor, no ocultar esta llave.
# Reemplaza estos dos valores por los de tu proyecto (Settings > API) y
# vuelve a compilar. Puedes sobreescribirlos sin tocar este archivo pasando
# -PSUPABASE_URL=... -PSUPABASE_ANON_KEY=... a Gradle (por ejemplo desde un
# secreto de GitHub Actions).
SUPABASE_URL=https://TU-PROYECTO.supabase.co
SUPABASE_ANON_KEY=TU-ANON-KEY
